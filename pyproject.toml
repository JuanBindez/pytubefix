[build-system]
requires = ["setuptools>=67.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytubefix"
version = "10.11-rc1"

authors = [
  { name="Juan Bindez", email="juanbindez780@gmail.com" },
]

description = "Python3 library for downloading YouTube Videos."
readme = "README.md"
requires-python = ">=3.7"

license = "MIT"
license-files = ["LICENSE"]

keywords = ["youtube", "download", "video", "stream"]

classifiers = [
	# How mature is this project? Common values are
	#   3 - Alpha
	#   4 - Beta
	#   5 - Production/Stable
	"Development Status :: 4 - Beta",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"Natural Language :: English",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.7",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python",
	"Topic :: Internet",
	"Topic :: Multimedia :: Video",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Terminals",
	"Topic :: Utilities",
]

dependencies = [
    "aiohttp >=3.12.13",
    "nodejs-wheel-binaries >= 22.20.0"
]

[project.urls]
"Homepage" = "https://github.com/juanbindez/pytubefix"
"Bug Reports" = "https://github.com/juanbindez/pytubefix/issues"
"Read the Docs" = "http://pytubefix.readthedocs.io/"

[project.scripts]
pytubefix = "pytubefix.cli:main"

[tool.setuptools.packages.find]
include = ["pytubefix*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"pytubefix" = ["botGuard/vm/*.js", "sig_nsig/vm/*.js"]